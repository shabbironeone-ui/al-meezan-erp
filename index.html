<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Al Meezan ERP - Dashboard</title>
  <style>
    :root { --primary: #1b5e20; --primary-hover: #2e7d32; --bg: #f4f6f9; --card-bg: #fff; --text: #333; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
    .wrapper { max-width: 600px; margin: auto; }
    
    /* Dashboard Header & Navigation */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .dashboard-header h1 { margin: 0; font-size: 18px; }
    .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; font-weight: 600; opacity: 0.9; }
    .nav-links a:hover { opacity: 1; text-decoration: underline; }

    /* Main Container Card */
    .container { background: var(--card-bg); padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 20px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    input:focus { border-color: var(--primary); outline: none; }
    input:readonly { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
    
    button { background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    
    .loading { text-align: center; display: none; color: #666; margin-top: 10px; font-size: 14px; }
    .info-box { font-size: 13px; margin-top: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Top Dashboard Menu -->
    <div class="dashboard-header">
      <h1>📊 Al Meezan Dashboard</h1>
      <div class="nav-links">
        <a href="#" onclick="alert('Dashboard Home')">Home</a>
        <a href="#" onclick="alert('Feature coming soon!')">Reports</a>
      </div>
    </div>

    <!-- Receipt Entry Card -->
    <div class="container">
      <h2>⚡ Fast Receipt Entry</h2>
      <form id="receiptForm" onsubmit="submitForm(event)">
        
        <div class="form-group">
          <label for="accountNo">Account No (Full Unique Number):</label>
          <input type="text" id="accountNo" name="accountNo" required placeholder="Type account no..." oninput="fetchCustomerData(this.value)">
          <div class="info-box" id="searchStatus"></div>
        </div>

        <div class="form-group">
          <label for="accountTitle">Account Title (Customer Name):</label>
          <input type="text" id="accountTitle" name="accountTitle" readonly placeholder="Auto-populated...">
        </div>

        <div class="form-group">
          <label for="salesman">Salesman:</label>
          <input type="text" id="salesman" name="salesman" readonly placeholder="Auto-populated...">
        </div>

        <div class="form-group">
          <label for="receiptNoCustom">Receipt No:</label>
          <input type="text" id="receiptNoCustom" name="receiptNoCustom" required placeholder="Enter Receipt No">
        </div>

        <div class="form-group">
          <label for="receiptAmount">Received Amount (Rs):</label>
          <input type="number" id="receiptAmount" name="receiptAmount" required placeholder="0.00">
        </div>

        <button type="submit" id="submitBtn">Save Receipt</button>
        <div class="loading" id="loadingMsg">Saving transaction securely...</div>
      </form>
    </div>
  </div>

  <script>
    let searchTimer;
    function fetchCustomerData(val) {
      clearTimeout(searchTimer);
      val = val.trim();
      
      if (val.length < 5) {
        document.getElementById('searchStatus').innerText = "Type complete account number...";
        document.getElementById('searchStatus').style.color = "#666";
        document.getElementById('accountTitle').value = "";
        document.getElementById('salesman').value = "";
        return;
      }

      document.getElementById('searchStatus').innerText = "Searching sale records...";
      document.getElementById('searchStatus').style.color = "#666";
      
      searchTimer = setTimeout(function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              document.getElementById('accountTitle').value = res.accountTitle;
              document.getElementById('salesman').value = res.salesman;
              document.getElementById('searchStatus').innerText = "✔ Found: " + res.accountTitle + " (Remaining Bal: " + res.balance + ")";
              document.getElementById('searchStatus').style.color = "green";
            } else {
              document.getElementById('searchStatus').innerText = "⚠ " + (res ? res.error : "Not found");
              document.getElementById('searchStatus').style.color = "red";
              document.getElementById('accountTitle').value = "";
              document.getElementById('salesman').value = "";
            }
          })
          .withFailureHandler(function(err) {
            document.getElementById('searchStatus').innerText = "⚠ Error: " + err.message;
            document.getElementById('searchStatus').style.color = "red";
          })
          .getCustomerDetailsForReceipt(val);
      }, 400);
    }

    function submitForm(event) {
      event.preventDefault();
      var submitBtn = document.getElementById('submitBtn');
      var loadingMsg = document.getElementById('loadingMsg');
      
      submitBtn.disabled = true;
      loadingMsg.style.display = 'block';

      var formData = {
        accountNo: document.getElementById('accountNo').value,
        accountTitle: document.getElementById('accountTitle').value,
        salesman: document.getElementById('salesman').value,
        receiptNoCustom: document.getElementById('receiptNoCustom').value,
        receiptAmount: document.getElementById('receiptAmount').value
      };

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          loadingMsg.style.display = 'none';
          
          if(response && response.success) {
            alert("Success! Receipt saved.\nBook No Calculated: " + response.bookNo + "\nNew Balance: " + response.newBalance);
            document.getElementById('receiptForm').reset();
            document.getElementById('searchStatus').innerText = "";
          } else {
            alert("Error: " + (response ? response.error : "Unknown error"));
          }
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          loadingMsg.style.display = 'none';
          alert("Error: " + error.message);
        })
        .saveReceipt(formData);
    }
  </script>
</body>
</html>
