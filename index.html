<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Meezan ERP - Dashboard</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #198754; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-success { background-color: #198754; border: none; }
        .btn-success:hover { background-color: #157347; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Al Meezan Dashboard</span>
            <div>
                <a href="#" class="text-white text-decoration-none me-3">Home</a>
                <a href="#" class="text-white text-decoration-none">Reports</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 bg-white">
                    <h4 class="text-center text-success mb-4">⚡ Fast Receipt Entry</h4>
                    
                    <form id="receiptForm">
                        <!-- Account No -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Account No (Full Unique Number):</label>
                            <input type="text" id="accountNo" class="form-control" placeholder="Type account no..." required>
                        </div>

                        <!-- Account Title -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Account Title (Customer Name):</label>
                            <input type="text" id="accountTitle" class="form-control bg-light" placeholder="Auto-populated..." readonly>
                        </div>

                        <!-- Salesman -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Salesman:</label>
                            <input type="text" id="salesman" class="form-control bg-light" placeholder="Auto-populated..." readonly>
                        </div>

                        <!-- Remaining Balance Display -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Current Balance (Rs):</label>
                            <input type="text" id="currentBalance" class="form-control bg-light text-danger fw-bold" placeholder="0.00" readonly>
                        </div>

                        <!-- Receipt No -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Receipt No:</label>
                            <input type="number" id="receiptNoCustom" class="form-control" placeholder="Enter Receipt No" required>
                        </div>

                        <!-- Received Amount -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Received Amount (Rs):</label>
                            <input type="number" step="any" id="receiptAmount" class="form-control" placeholder="0.00" required>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" id="submitBtn" class="btn btn-success btn-lg">Save Receipt</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to handle dynamic search and saving -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyihtI-yK6Z7HwUKS99pHFHg-55iRJ7hS9yQBvnLN9Apgo4S89-vR8Gv17aZtaUdtAq4g/exec";

        const accountNoInput = document.getElementById('accountNo');
        const accountTitleInput = document.getElementById('accountTitle');
        const salesmanInput = document.getElementById('salesman');
        const balanceInput = document.getElementById('currentBalance');
        const receiptForm = document.getElementById('receiptForm');
        const submitBtn = document.getElementById('submitBtn');

        // When user types account number, fetch details automatically
        accountNoInput.addEventListener('blur', function() {
            let accNo = accountNoInput.value.trim();
            if (!accNo) return;

            accountTitleInput.value = "Searching...";
            salesmanInput.value = "Searching...";
            balanceInput.value = "Searching...";

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Google Apps Script handles redirect, we use standard fetch
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "fetch", accountNo: accNo })
            })
            .then(() => {
                // Since no-cors hides response, we use a workaround or direct GET if needed, 
                // but let's query via standard GET/JSONP if direct return is required.
                // Alternatively, let's call via standard fetch using GET method for lookup:
            });

            // Reliable GET request for fetching data:
            fetch(`${SCRIPT_URL}?action=fetch&accountNo=${encodeURIComponent(accNo)}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    accountTitleInput.value = data.accountTitle || "";
                    salesmanInput.value = data.salesman || "";
                    balanceInput.value = data.balance || "0";
                } else {
                    alert(data.error || "Account not found!");
                    accountTitleInput.value = "";
                    salesmanInput.value = "";
                    balanceInput.value = "";
                }
            })
            .catch(err => {
                console.error("Error fetching data:", err);
                accountTitleInput.value = "";
                salesmanInput.value = "";
                balanceInput.value = "";
            });
        });

        // Form Submission to Save Receipt
        receiptForm.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            const formData = {
                accountNo: accountNoInput.value.trim(),
                accountTitle: accountTitleInput.value.trim(),
                salesman: salesmanInput.value.trim(),
                receiptNoCustom: document.getElementById('receiptNoCustom').value.trim(),
                receiptAmount: document.getElementById('receiptAmount').value.trim()
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "save", formData: formData })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Receipt Saved Successfully! New Balance: " + data.newBalance);
                    receiptForm.reset();
                    accountTitleInput.value = "";
                    salesmanInput.value = "";
                    balanceInput.value = "";
                } else {
                    alert("Error: " + data.error);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Receipt";
            })
            .catch(err => {
                console.error("Error saving:", err);
                alert("Receipt submitted or saved check sheet.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Receipt";
            });
        });
    </script>
</body>
</html>
